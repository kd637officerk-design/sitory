name: Build Windows App (.exe)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build web bundle
        run: npm run build
      - name: Build Windows Installer & Portable .exe
        run: npx electron-builder --config electron-builder.json --win nsis portable --publish never
      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SYMPHONY-8TH-Windows-App
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 30
      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
